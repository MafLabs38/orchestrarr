# Pipeline in the manner of Portarr's (the three products share conventions).
# Two lanes. A pull request into develop runs the light lane: lint, the tests with coverage and the security scans, so that
# iterating stays fast. The full lane adds SonarQube. It runs on every push to develop and main, on every pull request into main,
# on a pull request labelled `full-ci` (add the label before pushing) and on demand (Run workflow). A draft pull request, or one labelled `skip-quality`,
# stays on the light lane: the long checks run once it is marked ready, or never when it is skipped on purpose.
# Only develop and main publish an image: a pull request never does. A push to main also releases (semantic-release) and tags the image with
# the version; the cluster's GitOps (Flux) deploys the newest version tag.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "22"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # Decides the lane once, for every job below.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.lane.outputs.full }}
    steps:
      - id: lane
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          full=false
          if [ "$EVENT" != "pull_request" ] || [ "$BASE" = "main" ] || echo "$LABELS" | grep -q '"full-ci"'; then
            full=true
          fi
          # Skipping wins: a draft, or the skip-quality label, keeps the long checks off
          if [ "$DRAFT" = "true" ] || echo "$LABELS" | grep -q '"skip-quality"'; then
            full=false
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: dotnet format Orchestrarr.slnx --verify-no-changes
      - run: python3 -I -m unittest -q
        working-directory: tools/review-decisions
      - run: yarn install --frozen-lockfile
        working-directory: frontend
      - run: yarn lint
        working-directory: frontend
      - run: yarn stylelint
        working-directory: frontend
      - run: yarn format:check
        working-directory: frontend
      - run: yarn typecheck
        working-directory: frontend

  test-backend:
    name: test-backend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet build Orchestrarr.slnx --configuration Release
      - name: Tests with coverage
        run: >
          dotnet test --solution Orchestrarr.slnx --configuration Release --no-build --
          --coverage --coverage-output-format xml --results-directory "$PWD/coverage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-backend
          path: coverage/

  test-frontend:
    name: test-frontend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
        working-directory: frontend
      - run: yarn test:coverage
        working-directory: frontend
      - run: yarn build
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-frontend
          path: frontend/coverage/

  sonarqube:
    name: sonarqube
    runs-on: ubuntu-latest
    needs: [plan, test-backend, test-frontend]
    # Full lane only, once a SonarQube server is configured (repository variable and secret).
    if: needs.plan.outputs.full == 'true' && vars.SONAR_HOST_URL != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: coverage/
      # The scanner holds the Sonar token: its version is pinned in .config/dotnet-tools.json
      - run: dotnet tool restore
      # Roslyn analyzers are already enforced by the build and dotnet format: importing them into Sonar only duplicates them.
      - name: Begin SonarQube analysis
        run: >
          dotnet tool run dotnet-sonarscanner begin
          /k:"${{ github.repository_owner }}_${{ github.event.repository.name }}"
          /d:sonar.host.url="${{ vars.SONAR_HOST_URL }}"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.cs.vscoveragexml.reportsPaths="coverage/coverage-backend/**/*.xml"
          /d:sonar.javascript.lcov.reportPaths="coverage/coverage-frontend/lcov.info"
          /d:sonar.coverage.exclusions="**/obj/**,**/*.test.ts,**/*.test.tsx,**/testUtils.tsx,**/*.Test/**"
          /d:sonar.cs.roslyn.ignoreIssues=true
          /d:sonar.qualitygate.wait=true
      - run: dotnet build Orchestrarr.slnx
      - name: End SonarQube analysis
        run: dotnet tool run dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # gitleaks-action needs a license key on organization repositories; the CLI does not.
      - name: Secret scanning (gitleaks)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --verbose
      - name: Dependency and config scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: "1"

  # semantic-release decides the version on main only, from the Conventional Commits since the last tag (ADR 0009). It tags and publishes the
  # GitHub release; nothing is committed back to main. A run that finds nothing worth releasing leaves the version output empty.
  release:
    name: release
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, security, sonarqube]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(needs.*.result, 'failure') }}
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  image:
    name: image
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, security, release]
    # Integrated code only: pull requests never publish images. On main the release job ran first (or was skipped, on develop).
    if: ${{ !cancelled() && github.event_name == 'push' && needs.test-backend.result == 'success' && needs.test-frontend.result == 'success' && needs.security.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          # The branch name (develop, main) plus the commit; a release adds its version and latest.
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.version != '' }}
            type=raw,value=latest,enable=${{ needs.release.outputs.version != '' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.release.outputs.version != '' && format('{0}.{1}', needs.release.outputs.version, github.run_number) || format('0.0.0-{0}', steps.meta.outputs.version) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
