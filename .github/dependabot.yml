version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # React moves with Portarr and Mnemarr (the three products share their conventions): a decision, not a bot's pull request.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # The Node baseline (CI, README, image) changes everywhere at once, as a decision.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  # The image that holds the subscription token while a repair runs: its base is pinned by digest, and the bump is proposed here
  - package-ecosystem: "docker"
    directory: "/docker/agent"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
