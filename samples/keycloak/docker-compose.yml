# A throwaway identity provider for the local sandbox. Never for anything else: the users, the passwords and the client secret are in this
# folder, in clear text, and it listens on the loopback only.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./realm-orchestrarr.json:/opt/keycloak/data/import/realm-orchestrarr.json:ro
